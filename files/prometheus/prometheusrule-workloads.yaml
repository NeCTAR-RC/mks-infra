# Workload alerts scoped to the managed namespaces only, so we never page on
# customer-namespace workloads. These replace the kube-prometheus-stack
# `kubernetesApps` rule group, which is disabled on this cluster
# (defaultRules.rules.kubernetesApps: false in the prometheus values).
# Expressions are derived from the kube-prometheus-stack (kubernetes-mixin)
# rules with a namespace matcher added; re-check against the chart version
# (87.1.0) when upgrading. kube-system is intentionally excluded:
# sealed-secrets there is covered by its own component rule, not by
# namespace-wide workload alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: managed-workloads-rules
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: managed-workloads
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{
              reason="CrashLoopBackOff",
              namespace=~"observability|cert-manager|envoy-gateway-system"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "Pod is crash looping."
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff."
        - alert: KubePodNotReady
          expr: |
            sum by (namespace, pod, cluster) (
              kube_pod_status_phase{
                phase=~"Pending|Unknown|Failed",
                namespace=~"observability|cert-manager|envoy-gateway-system"}
            ) > 0
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "Pod has been in a non-ready state for more than 15 minutes."
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been non-ready for longer than 15 minutes."
        - alert: KubeDeploymentReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas{namespace=~"observability|cert-manager|envoy-gateway-system"}
                != kube_deployment_status_replicas_available{namespace=~"observability|cert-manager|envoy-gateway-system"}
            ) and (
              changes(kube_deployment_status_replicas_updated{namespace=~"observability|cert-manager|envoy-gateway-system"}[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "Deployment has not matched the expected number of replicas."
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the expected replica count for over 15 minutes."
        - alert: KubeStatefulSetReplicasMismatch
          expr: |
            (
              kube_statefulset_status_replicas_ready{namespace=~"observability|cert-manager|envoy-gateway-system"}
                != kube_statefulset_status_replicas{namespace=~"observability|cert-manager|envoy-gateway-system"}
            ) and (
              changes(kube_statefulset_status_replicas_updated{namespace=~"observability|cert-manager|envoy-gateway-system"}[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "StatefulSet has not matched the expected number of replicas."
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has not matched the expected replica count for over 15 minutes."
        - alert: KubeDaemonSetNotScheduled
          expr: |
            kube_daemonset_status_desired_number_scheduled{namespace=~"observability|cert-manager|envoy-gateway-system"}
              - kube_daemonset_status_current_number_scheduled{namespace=~"observability|cert-manager|envoy-gateway-system"} > 0
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "DaemonSet pods are not scheduled."
            description: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has pods that are desired but not scheduled."
