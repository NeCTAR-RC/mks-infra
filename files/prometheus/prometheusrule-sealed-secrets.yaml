# Conservative sealed-secrets alerts: controller availability plus unseal
# errors. Metric name follows the sealed-secrets controller exporter; the `job`
# matcher targets the controller's metrics service. Validate against live
# targets before relying on them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sealed-secrets-rules
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: sealed-secrets
      rules:
        - alert: SealedSecretsAbsent
          expr: absent(up{job=~"sealed-secrets.*"})
          for: 10m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "sealed-secrets controller is not being scraped."
            description: "The sealed-secrets controller has disappeared from Prometheus service discovery; SealedSecrets will not be unsealed into Secrets."
        - alert: SealedSecretsUnsealErrors
          expr: sum by (cluster) (rate(sealed_secrets_controller_unseal_errors_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
            owner: mks-admin
          annotations:
            summary: "sealed-secrets is failing to unseal."
            description: "The controller reported unseal errors over the last 15m; affected Secrets will not be created or updated."
