# LokiAbsent covers total unavailability, which the loki chart's bundled alerts
# (monitoring.alerts) do not provide. The 5xx error-rate signal now comes from
# the chart (LokiRequestErrors) and is no longer defined here to avoid a
# duplicate alert. owner: mks-admin so the central Alertmanager routes this to
# the MKS Slack channel.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-rules
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: loki
      rules:
        - alert: LokiAbsent
          expr: absent(up{job=~".*loki.*"})
          for: 10m
          labels:
            severity: critical
            owner: mks-admin
          annotations:
            summary: "Loki is not being scraped."
            description: "Loki has disappeared from Prometheus service discovery; log ingestion and queries may be unavailable."
