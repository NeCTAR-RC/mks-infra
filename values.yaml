# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

gateway:
  replicas: 2
  minAvailable: 1
  # Floating IP, created in the customer's OpenStack project beforehand, that
  # the Envoy LoadBalancer Service is pinned to. cloud-provider-openstack
  # looks the address up and attaches it instead of allocating a new one.
  loadBalancerIP:
  # Annotations added to the Envoy LoadBalancer Service. Per-cluster values
  # merge into this map rather than replacing it. keep-floatingip stops
  # cloud-provider-openstack releasing the floating IP if the Service is
  # ever deleted.
  serviceAnnotations:
    loadbalancer.openstack.org/keep-floatingip: "true"
  # Which namespaces may attach ListenerSets to the platform Gateway: None,
  # Same, All or Selector. With Selector, set selector to a label selector
  # over namespaces. Customers define hostnames, TLS and routes through
  # ListenerSets in their own namespaces; see README.md. The chart-managed
  # gateway.listeners list was removed in 1.0.0.
  allowedListeners:
    from: All
    selector: {}

letsencrypt:
  email:
  # Also render a letsencrypt-staging ClusterIssuer against the Let's Encrypt
  # staging endpoint, so customers can rehearse issuance without spending
  # production rate limits.
  staging: true

monitoring:
  # Create ServiceMonitors / PodMonitors / PrometheusRules for the MKS managed
  # components (rendered from files/prometheus/). Requires the Prometheus
  # operator CRDs (kube-prometheus-stack) on the cluster. Enable per-cluster.
  enabled: false

# Namespaces the restrict-project-admins admission policy treats as
# platform-owned. Project-admins (and customer service accounts) cannot write
# into them, and service accounts in them are trusted as platform identities.
# Every namespace whose workloads write into kube-system or manage protected
# cluster-scoped objects must be listed, or those workloads are denied: the
# OpenStack cloud-controller-manager holds its leader election lease in
# kube-system, and the tigera operator manages the Calico CRDs and
# ClusterRoles. Overriding this list per cluster replaces it, so include the
# defaults.
protectedNamespaces:
  # Kubernetes
  - kube-system
  - kube-public
  - kube-node-lease
  # Magnum-installed components
  - openstack-system
  - calico-system
  - tigera-operator
  - cilium-secrets
  - node-feature-discovery
  - node-problem-detector
  # MKS-managed components
  - envoy-gateway-system
  - cert-manager
  - observability
  - mks-infra
