---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # Let's Encrypt uses this address for expiry and account notices.
    email: {{ .Values.letsencrypt.email }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # Secret resource used to store the account's private key.
      name: letsencrypt-issuer-account-key
    solvers:
      {{- include "mks-infra.http01Solver" . | nindent 6 }}
{{- if .Values.letsencrypt.staging }}
---
# Same solver against the Let's Encrypt staging endpoint. Certificates it
# issues are not trusted by browsers; use it to rehearse a ListenerSet and
# its DNS before switching the annotation to letsencrypt.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: {{ .Values.letsencrypt.email }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-issuer-account-key
    solvers:
      {{- include "mks-infra.http01Solver" . | nindent 6 }}
{{- end }}
