---
# Custom ClusterRole — broad access without impersonate/bind/escalate
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-admin
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
# Bind the group to the custom role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-admins
subjects:
- kind: Group
  name: project-admins
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: project-admin
  apiGroup: rbac.authorization.k8s.io
---
# Admission policy — blocks access to protected namespaces and to
# platform-owned cluster-scoped objects (RBAC, this policy itself,
# webhook configurations, CRDs, gateway class, cluster issuer)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-project-admins
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["*"]
      scope: Namespaced
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["*"]
      scope: Cluster
  variables:
  - name: protectedNamespaces
    expression: "['kube-system', 'envoy-gateway-system', 'cert-manager', 'observability', 'mks-infra']"
  # Cluster-scoped objects owned by Kubernetes or the managed platform,
  # matched by exact name, name prefix, or '<api group>/<name>'. Anything
  # not matched is customer-owned and may be managed by project-admins
  # (e.g. ClusterRoles installed by their own Helm charts).
  - name: protectedClusterObjectNames
    expression: "['cluster-admin', 'admin', 'edit', 'view', 'project-admin', 'project-admins']"
  - name: protectedClusterObjectPrefixes
    expression: |
      ['system:', 'system-', 'kubeadm:', 'calico-', 'cilium',
       'cert-manager', 'envoy-gateway', 'fluent-bit', 'loki',
       'prometheus-', 'sealed-secrets', 'secrets-unsealer', 'mks-infra',
       'restrict-project-admins']
  - name: protectedClusterObjectGroupedNames
    expression: "['gateway.networking.k8s.io/default', 'cert-manager.io/letsencrypt']"
  - name: isProtectedClusterObject
    expression: |
      request.name in variables.protectedClusterObjectNames ||
      variables.protectedClusterObjectPrefixes.exists(p, request.name.startsWith(p)) ||
      (request.resource.group + '/' + request.name) in variables.protectedClusterObjectGroupedNames
  # CRDs belonging to platform components' API groups
  - name: protectedAPIGroupSuffixes
    expression: |
      ['.cert-manager.io', '.monitoring.coreos.com', '.gateway.networking.k8s.io',
       '.gateway.envoyproxy.io', '.bitnami.com', '.cilium.io', '.projectcalico.org']
  - name: isProjectAdmin
    expression: "'project-admins' in request.userInfo.groups"
  - name: isClusterScoped
    expression: "!has(request.namespace) || request.namespace == ''"
  - name: isCRD
    expression: |
      request.resource.group == 'apiextensions.k8s.io' &&
      request.resource.resource == 'customresourcedefinitions'
  - name: isNamespaceResource
    expression: |
      request.resource.group == '' &&
      request.resource.resource == 'namespaces'
  - name: isPrometheusRule
    expression: |
      request.resource.group == 'monitoring.coreos.com' &&
      request.resource.resource == 'prometheusrules'
  validations:
  # Block writes inside protected namespaces
  - expression: |
      !variables.isProjectAdmin ||
      variables.isClusterScoped ||
      !(request.namespace in variables.protectedNamespaces)
    message: "project-admins cannot modify resources in protected namespaces"
  # Block writes to Kubernetes' and the platform's own cluster-scoped
  # objects: RBAC, this admission policy, webhook configurations, the
  # gateway class and cluster issuer. Other cluster-scoped writes are
  # allowed; for RBAC the API server's escalation prevention still
  # applies, and because project-admin has no bind/escalate/impersonate,
  # project-admins can only grant permissions they already hold.
  - expression: |
      !variables.isProjectAdmin ||
      !variables.isClusterScoped ||
      variables.isNamespaceResource ||
      !variables.isProtectedClusterObject
    message: "project-admins cannot modify platform-owned cluster-scoped objects"
  # Block writes to CRDs that belong to the platform components' API groups
  - expression: |
      !variables.isProjectAdmin ||
      !variables.isCRD ||
      !variables.protectedAPIGroupSuffixes.exists(s, request.name.endsWith(s))
    message: "project-admins cannot modify platform CRDs"
  # Block modification or deletion of protected Namespace objects themselves
  - expression: |
      !variables.isProjectAdmin ||
      !variables.isNamespaceResource ||
      !(request.name in variables.protectedNamespaces)
    message: "project-admins cannot modify or delete protected namespaces"
  # Block project-admins from claiming the mks-admin alert owner on their own
  # PrometheusRules, which would route their alerts to the MKS on-call channel
  # via the central Alertmanager. Customer rules are otherwise evaluated and
  # alert through the local Alertmanager.
  - expression: |
      !variables.isProjectAdmin ||
      !variables.isPrometheusRule ||
      !(request.operation == 'CREATE' || request.operation == 'UPDATE') ||
      !has(object.spec) || !has(object.spec.groups) ||
      !object.spec.groups.exists(g,
        has(g.rules) && g.rules.exists(r,
          has(r.labels) && 'owner' in r.labels && r.labels['owner'] == 'mks-admin'))
    message: "project-admins cannot set the owner=mks-admin label on PrometheusRule alerts"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-project-admins-binding
spec:
  policyName: restrict-project-admins
  validationActions: [Deny]
