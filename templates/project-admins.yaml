---
# Custom ClusterRole — broad access without impersonate/bind/escalate
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-admin
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
# Bind the group to the custom role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-admins
subjects:
- kind: Group
  name: project-admins
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: project-admin
  apiGroup: rbac.authorization.k8s.io
---
# Admission policy — blocks access to protected namespaces and to
# platform-owned cluster-scoped objects (RBAC, this policy itself,
# webhook configurations, CRDs, gateway class, cluster issuer)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-project-admins
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["*"]
      scope: Namespaced
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["*"]
      scope: Cluster
  variables:
  # Namespaces owned by Kubernetes, Magnum (CNI, cloud provider, CSI, node
  # agents) or the managed platform. Writes into them are blocked for
  # restricted identities, and service accounts in them are trusted as
  # platform identities (see isPlatformSA). Configured via
  # .Values.protectedNamespaces so a cluster can extend the list.
  - name: protectedNamespaces
    expression: {{ .Values.protectedNamespaces | toJson | quote }}
  # Cluster-scoped objects owned by Kubernetes or the managed platform,
  # matched by exact name, name prefix, or '<api group>/<name>'. Anything
  # not matched is customer-owned and may be managed by project-admins
  # (e.g. ClusterRoles installed by their own Helm charts).
  - name: protectedClusterObjectNames
    expression: "['cluster-admin', 'admin', 'edit', 'view', 'project-admin', 'project-admins']"
  - name: protectedClusterObjectPrefixes
    expression: |
      ['system:', 'system-', 'kubeadm:', 'calico-', 'cilium',
       'cert-manager', 'envoy-gateway', 'fluent-bit', 'loki',
       'prometheus-', 'sealed-secrets', 'secrets-unsealer', 'mks-infra',
       'restrict-project-admins']
  - name: protectedClusterObjectGroupedNames
    expression: "['gateway.networking.k8s.io/default', 'cert-manager.io/letsencrypt']"
  - name: isProtectedClusterObject
    expression: |
      request.name in variables.protectedClusterObjectNames ||
      variables.protectedClusterObjectPrefixes.exists(p, request.name.startsWith(p)) ||
      (request.resource.group + '/' + request.name) in variables.protectedClusterObjectGroupedNames
  # CRDs belonging to platform components' API groups
  - name: protectedAPIGroupSuffixes
    expression: |
      ['.cert-manager.io', '.monitoring.coreos.com', '.gateway.networking.k8s.io',
       '.gateway.envoyproxy.io', '.bitnami.com', '.cilium.io', '.projectcalico.org']
  # Restricted identities: project-admins, users from the customer's OIDC
  # provider, and any service account outside the protected (platform)
  # namespaces. Restricting customer service accounts too means
  # project-admins cannot bypass this policy by delegating their RBAC
  # permissions to a service account, which would not carry the
  # project-admins group. Platform identities are unaffected: nodes,
  # control-plane components, and service accounts in protected namespaces
  # (including the Argo CD management service account in kube-system, and
  # the Magnum-installed components in openstack-system, tigera-operator
  # and friends, some of which write into kube-system or manage protected
  # cluster-scoped objects).
  - name: isPlatformSA
    expression: |
      variables.protectedNamespaces.exists(ns,
        request.userInfo.username.startsWith('system:serviceaccount:' + ns + ':'))
  # OIDC identities. When a cluster is created with the oidc_* Magnum
  # labels, the openstack-cluster chart fixes the kube-apiserver
  # --oidc-username-prefix and --oidc-groups-prefix to 'oidc:', so users
  # from the customer's identity provider are recognisable by prefix
  # whatever bindings a project-admin creates for them. Without this a
  # project-admin could bind an OIDC group to project-admin and its members
  # would escape every restriction below.
  - name: isOIDCIdentity
    expression: |
      request.userInfo.username.startsWith('oidc:') ||
      request.userInfo.groups.exists(g, g.startsWith('oidc:'))
  - name: isRestricted
    expression: |
      'project-admins' in request.userInfo.groups ||
      variables.isOIDCIdentity ||
      (request.userInfo.username.startsWith('system:serviceaccount:') &&
       !variables.isPlatformSA)
  - name: isClusterScoped
    expression: "!has(request.namespace) || request.namespace == ''"
  - name: isCRD
    expression: |
      request.resource.group == 'apiextensions.k8s.io' &&
      request.resource.resource == 'customresourcedefinitions'
  - name: isNamespaceResource
    expression: |
      request.resource.group == '' &&
      request.resource.resource == 'namespaces'
  - name: isPrometheusRule
    expression: |
      request.resource.group == 'monitoring.coreos.com' &&
      request.resource.resource == 'prometheusrules'
  validations:
  # Block writes inside protected namespaces
  - expression: |
      !variables.isRestricted ||
      variables.isClusterScoped ||
      !(request.namespace in variables.protectedNamespaces)
    message: "only the MKS platform can modify resources in protected namespaces"
  # Block writes to Kubernetes' and the platform's own cluster-scoped
  # objects: RBAC, this admission policy, webhook configurations, the
  # gateway class and cluster issuer. Other cluster-scoped writes are
  # allowed; for RBAC the API server's escalation prevention still
  # applies, and because project-admin has no bind/escalate/impersonate,
  # project-admins can only grant permissions they already hold, and any
  # OIDC user or group they grant them to is restricted by this policy too.
  - expression: |
      !variables.isRestricted ||
      !variables.isClusterScoped ||
      variables.isNamespaceResource ||
      !variables.isProtectedClusterObject
    message: "only the MKS platform can modify platform-owned cluster-scoped objects"
  # Block writes to CRDs that belong to the platform components' API groups
  - expression: |
      !variables.isRestricted ||
      !variables.isCRD ||
      !variables.protectedAPIGroupSuffixes.exists(s, request.name.endsWith(s))
    message: "only the MKS platform can modify platform CRDs"
  # Block modification or deletion of protected Namespace objects themselves
  - expression: |
      !variables.isRestricted ||
      !variables.isNamespaceResource ||
      !(request.name in variables.protectedNamespaces)
    message: "only the MKS platform can modify or delete protected namespaces"
  # Block project-admins from claiming the mks-admin alert owner on their own
  # PrometheusRules, which would route their alerts to the MKS on-call channel
  # via the central Alertmanager. Customer rules are otherwise evaluated and
  # alert through the local Alertmanager.
  - expression: |
      !variables.isRestricted ||
      !variables.isPrometheusRule ||
      !(request.operation == 'CREATE' || request.operation == 'UPDATE') ||
      !has(object.spec) || !has(object.spec.groups) ||
      !object.spec.groups.exists(g,
        has(g.rules) && g.rules.exists(r,
          has(r.labels) && 'owner' in r.labels && r.labels['owner'] == 'mks-admin'))
    message: "the owner=mks-admin label on PrometheusRule alerts is reserved for the MKS platform"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-project-admins-binding
spec:
  policyName: restrict-project-admins
  validationActions: [Deny]
