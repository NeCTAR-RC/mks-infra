---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.gateway.replicas }}
      envoyPDB:
        minAvailable: {{ .Values.gateway.minAvailable }}
      {{- if or .Values.gateway.loadBalancerIP .Values.gateway.serviceAnnotations }}
      envoyService:
        {{- with .Values.gateway.loadBalancerIP }}
        # cloud-provider-openstack attaches this pre-existing floating IP to
        # the Octavia load balancer instead of allocating a new one.
        loadBalancerIP: {{ . }}
        {{- end }}
        {{- with .Values.gateway.serviceAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
